[project]
name = "axonfleet"
version = "0.1.0"
description = "Fast one-dimensional peripheral nerve axon simulations"
authors = [
    {name = "louisreg", email = "l.regnacq@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.10.1,<0.11.0",
    "numpy>=1.26.4,<3.0.0",
    "pint>=0.24,<1.0.0",
    "scipy>=1.16.1,<2.0.0",
    "psutil>=7.0.0,<8.0.0",
    "rich>=13.9.0,<15.0.0",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10.5,<4.0.0",
]
benchmark = [
    "matplotlib>=3.10.5,<4.0.0",
    "pandas>=2.3.1,<3.0.0",
]
cuda12 = [
    "jax[cuda12]>=0.10.1,<0.11.0",
    "jax-triton>=0.3.1,<0.4.0",
    "triton>=3.6.0,<4.0.0",
]
nrv = [
    "nrv-py>=1.4.0,<2.0.0",
]
dev = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "mypy>=1.11.0,<2.0.0",
    "matplotlib>=3.10.5,<4.0.0",
    "pandas>=2.3.1,<3.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nrv: requires NRV installed (slow)",
    "nrv_intracellular: intracellular stimulation comparisons vs NRV",
    "nrv_velocity: conduction velocity vs diameter comparisons vs NRV",
    "nrv_extracellular: extracellular stimulation comparisons vs NRV",
    "nrv_numerics: NRV-adjacent numerical and solver diagnostics",
]

[tool.coverage.run]
source = ["src/axonfleet"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
