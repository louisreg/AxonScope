<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">Double-cable solver optimization campaign speedups</title>
  <desc id="desc">Horizontal bar chart of median geomean speedups relative to the retained JAX PCR SoA baseline. Archived candidates are shown in muted colors.</desc>
  <rect width="920" height="390" fill="#ffffff"/>
  <text x="36" y="34" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">Double-cable solver experiments, June 2026</text>
  <text x="36" y="58" font-family="Arial, sans-serif" font-size="12" fill="#52616b">Geomean speedup vs retained JAX pcr_soa/pcr_adaptive baseline. Validation-failed custom kernels stay archived.</text>

  <g transform="translate(260,84)" font-family="Arial, sans-serif">
    <line x1="0" y1="250" x2="540" y2="250" stroke="#c9d1d9"/>
    <g fill="#6b7280" font-size="11">
      <text x="-4" y="270" text-anchor="end">0x</text>
      <text x="176" y="270" text-anchor="middle">1x</text>
      <text x="356" y="270" text-anchor="middle">2x</text>
      <text x="536" y="270" text-anchor="middle">3x</text>
    </g>
    <g stroke="#e5e7eb">
      <line x1="180" y1="0" x2="180" y2="250"/>
      <line x1="360" y1="0" x2="360" y2="250"/>
      <line x1="540" y1="0" x2="540" y2="250"/>
    </g>

    <g font-size="12" fill="#243b53">
      <text x="-14" y="18" text-anchor="end">pcr_soa / pcr_adaptive</text>
      <rect x="0" y="5" width="180" height="18" rx="3" fill="#2f80ed"/>
      <text x="190" y="19" fill="#111827">1.00x retained</text>

      <text x="-14" y="50" text-anchor="end">pcr_soa_nomask</text>
      <rect x="0" y="37" width="180" height="18" rx="3" fill="#94a3b8"/>
      <text x="190" y="51" fill="#111827">1.00x archived</text>

      <text x="-14" y="82" text-anchor="end">pcr_soa_layout_auto</text>
      <rect x="0" y="69" width="176" height="18" rx="3" fill="#94a3b8"/>
      <text x="186" y="83" fill="#111827">0.98x archived</text>

      <text x="-14" y="114" text-anchor="end">assoc_backward</text>
      <rect x="0" y="101" width="115" height="18" rx="3" fill="#94a3b8"/>
      <text x="125" y="115" fill="#111827">0.64x vs pcr_soa</text>

      <text x="-14" y="146" text-anchor="end">triton_pcr_soa</text>
      <rect x="0" y="133" width="291" height="18" rx="3" fill="#f59e0b"/>
      <text x="301" y="147" fill="#111827">1.62x archived</text>

      <text x="-14" y="178" text-anchor="end">jax_triton_block_thomas</text>
      <rect x="0" y="165" width="358" height="18" rx="3" fill="#f59e0b"/>
      <text x="368" y="179" fill="#111827">1.99x validation failed</text>

      <text x="-14" y="210" text-anchor="end">triton_block_thomas</text>
      <rect x="0" y="197" width="483" height="18" rx="3" fill="#ef4444"/>
      <text x="493" y="211" fill="#111827">2.68x no clean JAX route</text>

      <text x="-14" y="242" text-anchor="end">jax_triton_thomas E2E kernel</text>
      <rect x="0" y="229" width="287" height="18" rx="3" fill="#f59e0b"/>
      <text x="297" y="243" fill="#111827">1.60x validation failed</text>
    </g>
  </g>
</svg>
